<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Contest — Contest System</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/toast.js"></script>
  <style>
    .step-panel { display: none; }
    .step-panel.active { display: block; }

    /* ── Add-problem form ── */
    .add-problem-form .form-section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .field-error {
      color: var(--red, #e74c3c);
      font-size: 0.78rem;
      margin-top: 0.2rem;
      display: none;
    }
    .required { color: var(--red, #e74c3c); }
    .hint-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .hint-input { flex: 1; font-size: 0.875rem; }
    .btn-remove-hint {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      padding: 0.2rem 0.45rem;
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    .test-case-row {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 2rem 0.6rem 0.6rem;
      margin-bottom: 0.5rem;
      position: relative;
      background: var(--card-bg);
    }
    .tc-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .tc-col label {
      font-size: 0.75rem;
      font-weight: 600;
      display: block;
      margin-bottom: 0.25rem;
    }
    .btn-remove-tc {
      position: absolute;
      top: 0.4rem;
      right: 0.4rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .csv-format-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      line-height: 1.6;
    }
    .csv-format-box code {
      font-family: 'SF Mono', Consolas, monospace;
      background: var(--bg);
      padding: 0.1em 0.3em;
      border-radius: 3px;
    }
    .form-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    #add-prob-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1.25rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }
    #add-prob-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .loading-text { color: var(--text-muted); font-size: 0.875rem; margin-top: 0.5rem; }
    .btn-secondary {
      background: var(--border);
      color: var(--text);
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.875rem;
    }
    .btn-sm { padding: 0.25rem 0.75rem !important; font-size: 0.8rem !important; }

    /* ── Added-problems sidebar list ── */
    .added-problem-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 0.4rem;
      background: var(--card-bg);
      font-size: 0.875rem;
    }
    .prob-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 0.75rem;
      flex-shrink: 0;
    }
    .prob-title {
      flex: 1;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .prob-type-badge {
      font-size: 0.65rem;
      background: var(--green, #27ae60);
      color: #fff;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .btn-remove-prob {
      background: none;
      border: 1px solid var(--red, #e74c3c);
      color: var(--red, #e74c3c);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      cursor: pointer;
      font-size: 0.7rem;
      flex-shrink: 0;
    }
    .no-problems-yet {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      padding: 1rem 0;
    }

    textarea.form-control { resize: vertical; min-height: 80px; font-family: inherit; }
    .form-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
  </style>
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>Contest System</h1>
      <p>Programming Contests</p>
    </div>
    <ul class="sidebar-nav">
      <li><a href="/">&#127968;&nbsp; Home</a></li>
      <li><a href="/contests.html" class="active">&#127942;&nbsp; Contests</a></li>
      <li><a href="/users.html">&#128101;&nbsp; Users</a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <strong id="nav-username">—</strong>
        Logged in
      </div>
      <button onclick="doLogout()" class="btn btn-danger btn-sm btn-full">Logout</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="page-header">
      <h2>Create Contest</h2>
      <p>Set up a new programming contest</p>
    </div>

    <!-- Step indicator -->
    <div class="steps">
      <div class="step-indicator active" id="step-ind-1">1 — Contest Details</div>
      <div class="step-indicator" id="step-ind-2">2 — Add Problems</div>
    </div>

    <div id="global-err" class="alert alert-error hidden"></div>

    <!-- ── STEP 1: Contest Details ── -->
    <div class="step-panel active" id="step1">
      <div class="card" style="max-width:600px;">
        <div class="card-body">

          <div class="form-group">
            <label for="contest-name">Contest Name <span style="color:var(--red)">*</span></label>
            <input type="text" id="contest-name" class="form-control"
                   placeholder="e.g. Spring Cup 2026" maxlength="120">
          </div>

          <div class="form-group">
            <label for="contest-password">Password
              <span class="form-hint" style="font-weight:400;">(optional — leave blank for public)</span>
            </label>
            <input type="password" id="contest-password" class="form-control"
                   placeholder="Leave blank for a public contest">
          </div>

          <div class="form-group">
            <label for="start-time">Start Time <span style="color:var(--red)">*</span></label>
            <input type="datetime-local" id="start-time" class="form-control">
          </div>

          <div class="form-group">
            <label>Duration <span style="color:var(--red)">*</span></label>
            <div class="form-row">
              <div class="form-group" style="margin-bottom:0;">
                <input type="number" id="dur-hours" class="form-control" min="0" max="72"
                       placeholder="Hours" value="2">
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <input type="number" id="dur-minutes" class="form-control" min="0" max="59"
                       placeholder="Minutes" value="0">
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="description">Description
              <span class="form-hint" style="font-weight:400;">(optional)</span>
            </label>
            <textarea id="description" class="form-control" rows="3"
                      placeholder="Contest rules, topics, grading system…"></textarea>
          </div>

          <div id="step1-err" class="alert alert-error hidden"></div>

          <button onclick="goToStep2()" id="step1-next-btn" class="btn btn-primary">
            Next: Add Problems →
          </button>
        </div>
      </div>
    </div>

    <!-- ── STEP 2: Add Problems ── -->
    <div class="step-panel" id="step2">
      <div style="display:grid;grid-template-columns:1fr 300px;gap:1.5rem;align-items:start;">

        <!-- Add problem panel (form injected from addProblem.js) -->
        <div class="card">
          <div class="card-header">
            <h3>Add Custom Problem</h3>
            <small id="contest-name-display" style="color:var(--text-muted);font-size:0.8rem;"></small>
          </div>
          <div class="card-body" id="add-problem-container">
            <!-- Injected by getAddProblemFormHTML() after contest is created -->
          </div>
        </div>

        <!-- Problem list + navigation -->
        <div>
          <div class="card">
            <div class="card-header">
              <h3 id="problem-count-label">Problems (0)</h3>
            </div>
            <div class="card-body" style="padding:0.75rem;">
              <div id="added-problems-list">
                <p class="no-problems-yet">No problems added yet.</p>
              </div>
            </div>
          </div>

          <button onclick="goToManager()" class="btn btn-primary btn-full"
                  style="margin-top:0.75rem;">
            Go to Contest Manager →
          </button>
          <button onclick="backToStep1()" class="btn btn-full"
                  style="background:var(--border);color:var(--text);margin-top:0.5rem;">
            ← Back to Details
          </button>
        </div>

      </div>
    </div>
  </main>
</div>

<script src="/js/addProblem.js"></script>
<script src="/js/api.js"></script>
<script>
  window.addedProblems    = [];
  window.currentContestId = null;

  // ── Auth gate ──────────────────────────────────────────────
  (async () => {
    const authData = await apiFetch('/auth/me');
    if (!authData) return;
    document.getElementById('nav-username').textContent = authData.user.username;
    const minDate = new Date(Date.now() + 5 * 60 * 1000);
    document.getElementById('start-time').min = minDate.toISOString().slice(0, 16);
  })();

  async function doLogout() {
    await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
    window.location.href = '/login.html';
  }

  // ── Step navigation ────────────────────────────────────────
  async function goToStep2() {
    const name     = document.getElementById('contest-name').value.trim();
    const startRaw = document.getElementById('start-time').value;
    const hours    = parseInt(document.getElementById('dur-hours').value)   || 0;
    const minutes  = parseInt(document.getElementById('dur-minutes').value) || 0;
    const errEl    = document.getElementById('step1-err');
    errEl.classList.add('hidden');

    if (!name)     return showError(errEl, 'Contest name is required.');
    if (!startRaw) return showError(errEl, 'Start time is required.');
    if (new Date(startRaw) <= new Date()) return showError(errEl, 'Start time must be in the future.');
    const durMins = hours * 60 + minutes;
    if (durMins <= 0) return showError(errEl, 'Duration must be at least 1 minute.');

    // If contest was already created (user went back then forward), just re-advance.
    if (window.currentContestId) {
      advanceToStep2();
      return;
    }

    const btn = document.getElementById('step1-next-btn');
    btn.disabled    = true;
    btn.textContent = 'Creating…';

    const created = await apiFetch('/contests', {
      method: 'POST',
      body: {
        name,
        password:         document.getElementById('contest-password').value || null,
        start_time:       startRaw,
        duration_minutes: durMins,
        description:      document.getElementById('description').value.trim() || null,
      }
    });

    btn.disabled    = false;
    btn.textContent = 'Next: Add Problems →';
    if (!created) return;

    window.currentContestId = created.id;
    document.getElementById('add-problem-container').innerHTML = getAddProblemFormHTML();
    document.getElementById('contest-name-display').textContent = name;
    advanceToStep2();
  }

  function advanceToStep2() {
    document.getElementById('step1').classList.remove('active');
    document.getElementById('step2').classList.add('active');
    document.getElementById('step-ind-1').classList.remove('active');
    document.getElementById('step-ind-1').classList.add('done');
    document.getElementById('step-ind-2').classList.add('active');
  }

  function backToStep1() {
    document.getElementById('step2').classList.remove('active');
    document.getElementById('step1').classList.add('active');
    document.getElementById('step-ind-2').classList.remove('active');
    document.getElementById('step-ind-1').classList.remove('done');
    document.getElementById('step-ind-1').classList.add('active');
  }

  function goToManager() {
    if (!window.currentContestId) return;
    window.location.href = `/manager.html?id=${window.currentContestId}`;
  }

  // On create-contest page Cancel just clears errors — form stays visible.
  window.cancelAddProblem = function () {
    ['add-prob-error','prob-title-error','prob-statement-error',
     'prob-input-error','prob-output-error','prob-samples-error'].forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.textContent = ''; el.style.display = 'none'; }
    });
  };

  // ── onProblemAdded override for create-contest context ────
  window.onProblemAdded = function (problem) {
    window.addedProblems = window.addedProblems || [];
    window.addedProblems.push({
      id:    problem.id,
      label: String.fromCharCode(65 + (window.addedProblems.length)),
      title: problem.title,
      type:  'custom'
    });
    renderAddedProblemsList();

    if (typeof showToast === 'function') {
      showToast(`Problem "${problem.title}" added!`, 'success');
    }

    // Reset form fields but keep form open for adding more
    document.getElementById('prob-title').value         = '';
    document.getElementById('prob-statement').value     = '';
    document.getElementById('prob-input-format').value  = '';
    document.getElementById('prob-output-format').value = '';
    document.getElementById('prob-constraints').value   = '';
    document.getElementById('prob-csv-file').value      = '';
    document.getElementById('csv-upload-result').textContent = '';

    // Reset sample test cases to one empty row
    document.getElementById('sample-cases-container').innerHTML = `
      <div class="test-case-row">
        <div class="tc-pair">
          <div class="tc-col">
            <label>Input</label>
            <textarea class="tc-input" rows="3"></textarea>
          </div>
          <div class="tc-col">
            <label>Expected Output</label>
            <textarea class="tc-output" rows="3"></textarea>
          </div>
        </div>
        <button type="button" class="btn-remove-tc"
          onclick="removeSampleCase(this)">&#x2715;</button>
      </div>
    `;

    // Reset hints
    document.getElementById('hints-container').innerHTML = '';
  };

  function renderAddedProblemsList() {
    const list     = document.getElementById('added-problems-list');
    const problems = window.addedProblems || [];
    if (!problems.length) {
      list.innerHTML = '<p class="no-problems-yet">No problems added yet.</p>';
      document.getElementById('problem-count-label').textContent = 'Problems (0)';
      return;
    }
    list.innerHTML = problems.map((p, i) => `
      <div class="added-problem-row">
        <span class="prob-label">${p.label}</span>
        <span class="prob-title">${escapeHtml(p.title)}</span>
        <span class="prob-type-badge">Custom</span>
        <button type="button" class="btn-remove-prob"
          onclick="removeAddedProblem(${i})">&#x2715;</button>
      </div>
    `).join('');
    document.getElementById('problem-count-label').textContent =
      `Problems (${problems.length})`;
  }

  function removeAddedProblem(index) {
    const problem = (window.addedProblems || [])[index];
    if (!problem) return;

    fetch(`/api/contests/${window.currentContestId}/problems/${problem.id}`, {
      method: 'DELETE'
    }).then(() => {
      window.addedProblems.splice(index, 1);
      window.addedProblems.forEach((p, i) => {
        p.label = String.fromCharCode(65 + i);
      });
      renderAddedProblemsList();
    }).catch(err => console.error('Remove failed:', err));
  }

  function escapeHtml(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function showError(el, msg) {
    el.textContent = msg;
    el.classList.remove('hidden');
  }
</script>
</body>
</html>
