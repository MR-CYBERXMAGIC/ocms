<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Contest System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">Contest System</h1>
      <p class="auth-subtitle">Create your account</p>

      <div id="error-msg" class="alert alert-error hidden"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="full_name">Full Name</label>
          <input class="form-control" type="text" id="full_name" name="full_name"
                 placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label for="username">Username</label>
          <input class="form-control" type="text" id="username" name="username"
                 placeholder="Choose a unique username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email"
                 placeholder="your@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password"
                 placeholder="Minimum 6 characters" required
                 autocomplete="new-password" minlength="6">
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary btn-full">
          Create Account
        </button>
      </form>

      <p class="auth-footer">Already have an account? <a href="/login.html">Sign in</a></p>
    </div>
  </div>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('error-msg');
      const btn   = document.getElementById('submit-btn');

      errEl.classList.add('hidden');
      btn.disabled    = true;
      btn.textContent = 'Creating account…';

      try {
        const res = await fetch('/api/auth/register', {
          method:      'POST',
          credentials: 'include',
          headers:     { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: document.getElementById('full_name').value.trim(),
            username:  document.getElementById('username').value.trim(),
            email:     document.getElementById('email').value.trim(),
            password:  document.getElementById('password').value,
          }),
        });

        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || 'Registration failed. Please try again.';
          errEl.classList.remove('hidden');
        } else {
          window.location.replace('/');
        }
      } catch {
        errEl.textContent = 'Network error. Please try again.';
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
